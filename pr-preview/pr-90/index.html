    <style>html,body{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#7ec8e3;width:100%;height:100%;margin:0;padding:0;overflow:hidden}#game{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);position:fixed;inset:0}canvas{image-rendering:pixelated;image-rendering:crisp-edges}#start{z-index:10;background:#7ec8e3;font-family:Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;transition:opacity .45s;position:fixed;inset:0;overflow:hidden}@media (orientation:portrait){#start.land{transform-origin:0 0;width:100vh;height:100vw;inset:0 auto auto 100vw;transform:rotate(90deg)}#start.land .turn{display:block}}#start .turn{text-align:center;color:#fff;text-shadow:0 1px 3px #0009;font-size:clamp(11px,3vmin,16px);font-weight:800;display:none;position:absolute;bottom:2.5%;left:0;right:0}#start.gone{opacity:0;pointer-events:none}#start .bg{object-fit:cover;width:100%;height:100%;position:absolute;inset:0}#start video.bg{opacity:0;transition:opacity .6s}#start video.bg.on{opacity:1}#start .shade{background:linear-gradient(#14325047,#14325000 34% 58%,#14325080);position:absolute;inset:0}#start .title{top:calc(7% + env(safe-area-inset-top));text-align:center;pointer-events:none;position:absolute;left:0;right:0}#start h1{letter-spacing:.04em;color:#ffd166;-webkit-text-stroke:.09em #7a4a22;paint-order:stroke fill;text-shadow:0 .07em #5a3416,0 .16em .22em #00000059;margin:0;font-size:clamp(40px,11vmin,84px);font-weight:900}#start h2{color:#fff;-webkit-text-stroke:.14em #2f7fb0;paint-order:stroke fill;letter-spacing:.3em;margin:.2em 0 0;font-size:clamp(16px,4.2vmin,30px);font-weight:800}#startBtn{left:50%;bottom:calc(9% + env(safe-area-inset-bottom));color:#fff;min-width:46vmin;font:inherit;letter-spacing:.12em;white-space:nowrap;text-shadow:0 .06em #b3541a;cursor:pointer;background:linear-gradient(#ffb347,#ff8a3c);border:.14em solid #fff;border-radius:999px;padding:.55em 1.6em;font-size:clamp(20px,5.6vmin,36px);font-weight:900;animation:1.5s ease-in-out infinite startPulse;position:absolute;transform:translate(-50%);box-shadow:0 .2em #c9601f,0 .42em .7em #00000059}#startBtn:active{transform:translate(-50%)translateY(.12em)scale(.97);box-shadow:0 .08em #c9601f,0 .2em .4em #00000059}@keyframes startPulse{50%{filter:brightness(1.12);min-width:49vmin}}@media (prefers-reduced-motion:reduce){#startBtn{animation:none}}</style>
