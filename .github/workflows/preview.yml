name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        run: npm run build
        env:
          PREVIEW: '1'
          BUILD_LABEL: pr${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
      # 빌드 결과를 gh-pages/pr-preview/pr-<번호>/ 에 올리고, PR에 미리보기 링크 댓글을 단다.
      # PR이 닫히면 미리보기 폴더를 자동 삭제한다.
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
